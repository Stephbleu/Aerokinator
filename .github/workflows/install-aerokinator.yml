name: Install Aérokinator V2

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Aérokinator V2
        run: |
          unzip -o aerokinator-v2-github-pages.zip -d /tmp/aerokinator
          cp -R /tmp/aerokinator/aerokinator-v2/. .

      - name: Commit files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Install Aérokinator V2" || echo "No changes to commit"
          git push
